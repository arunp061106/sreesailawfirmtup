<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Premium Navy Gradient matching website theme -->
    <radialGradient id="badgeBg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#182e4b" />
      <stop offset="70%" stop-color="#0a1727" />
      <stop offset="100%" stop-color="#050c15" />
    </radialGradient>
    <!-- Subtle drop shadow on the white collar -->
    <filter id="collarShade" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="rgba(0, 0, 0, 0.45)" />
    </filter>
  </defs>

  <!-- Outer Dark Circle Badge -->
  <circle cx="60" cy="60" r="57" fill="url(#badgeBg)" stroke="#c5a059" stroke-width="2.8" />
  
  <!-- Inner Fine Ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2" />

  <!-- Advocate Wing Collar and Legal Bands Group -->
  <g filter="url(#collarShade)" fill="#ffffff">
    <!-- Top Wing Collar / Bow Neckband -->
    <!-- Left Wing -->
    <path d="M60,42 L39,33 C37,36 34.5,45 35,49 L46.5,46 L53,44 Z" />
    
    <!-- Right Wing -->
    <path d="M60,42 L81,33 C83,36 85.5,45 85,49 L73.5,46 L67,44 Z" />
    
    <!-- Center Neck Tie Knot / Band Root -->
    <path d="M53,42 L67,42 L65,47 L55,47 Z" />

    <!-- Left Advocate Band (Tabs) -->
    <polygon points="54,46 59,46 56.5,90 43,90" />

    <!-- Right Advocate Band (Tabs) -->
    <polygon points="61,46 66,46 77,90 63.5,90" />
  </g>
</svg>
